<!DOCTYPE html>
#تطوير وإعداد: [ فهد متعب السبيعي ]
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Path | الدليل الكامل والخطط</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
  --bg:#070a0f;
  --card:#0f1623;
  --accent:#00ffc3;
  --blue:#4da3ff;
  --red:#ff4d6d;
  --green:#2dd4bf;
  --text:#e6edf3;
  --muted:#8b9bb0;
}

body {
  margin:0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  line-height: 1.6;
}

.nav-top { max-width: 1200px; margin: 0 auto; display: flex; justify-content: flex-start; padding: 10px 0; }
.home-link { color: var(--accent); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 8px; opacity: 0.8; transition: 0.3s; }
.home-link:hover { opacity: 1; text-shadow: 0 0 8px var(--accent); }

.header { text-align: center; padding: 20px 0; }
.header h1 { color: var(--accent); font-size: 28px; margin-bottom: 10px; }

/* قسم الشهادات الموصى بها */
#recommendedSection {
    max-width: 1200px;
    margin: 20px auto 40px;
    padding: 25px;
    background: rgba(0, 255, 195, 0.03);
    border: 2px solid var(--accent);
    border-radius: 20px;
    display: none;
}

.recommendation-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
    color: var(--accent);
}

/* تنسيق الشبكة */
.section-title {
  max-width: 1200px;
  margin: 40px auto 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--muted);
  padding-bottom: 10px;
  font-size: 18px;
}

.courses-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  max-width: 1200px;
  margin: 0 auto;
}

.course-card {
  background: var(--card);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 12px;
  padding: 20px;
  cursor: pointer;
  transition: 0.3s;
  display: flex;
  flex-direction: column;
}

.course-card:hover { transform: translateY(-5px); border-color: var(--accent); }

.badge { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-bottom: 10px; display: inline-block; width: fit-content; }
.badge-red { background: rgba(255, 77, 109, 0.1); color: var(--red); }
.badge-blue { background: rgba(77, 163, 255, 0.1); color: var(--blue); }
.badge-green { background: rgba(45, 212, 191, 0.1); color: var(--green); }

.course-title { font-size: 17px; font-weight: bold; color: #fff; margin-bottom: 8px; }
.course-desc { font-size: 13px; color: var(--muted); margin-bottom: 15px; flex-grow: 1; }

.meta-info { display: flex; justify-content: space-between; font-size: 11px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; }

/* Modal */
.modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
.modal-content { background: var(--card); margin: 5% auto; padding: 30px; border-radius: 20px; width: 90%; max-width: 600px; border: 1px solid var(--accent); color: #fff; }
.close-btn { float: left; font-size: 24px; cursor: pointer; color: var(--muted); }

footer { text-align: center; margin-top: 60px; padding: 30px; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>

<div class="nav-top">
    <a href="page1.html" class="home-link"><i class="fas fa-home"></i><span>الرئيسية</span></a>
</div>

<div class="header">
    <h1>دليل الشهادات والمسارات</h1>
</div>

<div id="recommendedSection">
    <div class="recommendation-header">
        <i class="fas fa-star"></i>
        <h2>خطتك الدراسية المقترحة</h2>
    </div>
    <div class="courses-grid" id="recommendedGrid"></div>
</div>

<div id="allSections">
    <div class="section-title">استكشف كافة المسارات</div>
    
    <h3 style="max-width:1200px; margin:20px auto; color:var(--red);">● المسار الهجومي (Offensive)</h3>
    <div class="courses-grid" id="grid-offensive"></div>

    <h3 style="max-width:1200px; margin:20px auto; color:var(--blue);">● المسار الدفاعي (Defensive)</h3>
    <div class="courses-grid" id="grid-defensive"></div>

    <h3 style="max-width:1200px; margin:20px auto; color:var(--green);">● مسار الحوكمة (GRC)</h3>
    <div class="courses-grid" id="grid-grc"></div>
</div>

<div id="infoModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modalContent"></div>
    </div>
</div>

<footer>جميع الحقوق محفوظة &copy; 2026</footer>

<script>
const data = {
    // هجومي (4)
    net: { cat: 'offensive', level: 'مبتدئ', title: "CompTIA Network+", price: "1,342 ر.س", mode: "عن بعد", desc: "أساسيات الشبكات والبروتوكولات (OSI Model).", org: "CompTIA", points: ["السعر: 1,342 ريال", "تأسيس صلب للشبكات"] },
    ejpt: { cat: 'offensive', level: 'تأسيس', title: "eJPTv2", price: "934 ر.س", mode: "عملي", desc: "أول خطوة عملية في عالم اختبار الاختراق.", org: "INE Security", points: ["اختبار عملي 48 ساعة", "يركز على المهارات الأساسية"] },
    pnpt: { cat: 'offensive', level: 'متوسط', title: "PNPT / CEH Practical", price: "1,875 ر.س", mode: "عملي", desc: "محاكاة واقعية لعملية اختراق كاملة لشركة.", org: "TCM Security", points: ["بدون مراقبة بالكاميرا", "تركز على تقرير الاختراق"] },
    oscp: { cat: 'offensive', level: 'محترف', title: "OffSec OSCP", price: "6,184 ر.س", mode: "عملي مراقب", desc: "الشهادة الأقوى والمعيار الذهبي للهجوميين.", org: "OffSec", points: ["اختبار 24 ساعة", "تتطلب مهارات عالية في Linux"] },
    
    // دفاعي (4)
    sec: { cat: 'defensive', level: 'مبتدئ', title: "CompTIA Security+", price: "1,470 ر.س", mode: "نظري/عملي", desc: "مدخل أساسي وشامل لمفاهيم الأمن السيبراني.", org: "CompTIA", points: ["مطلوبة في الوظائف الحكومية", "تغطي التهديدات والمخاطر"] },
    btl1: { cat: 'defensive', level: 'تأسيس', title: "BTL1", price: "1,875 ر.س", mode: "عملي", desc: "تدريب عملي على أدوات محللي الـ SOC.", org: "Security Blue Team", points: ["تركز على الاستجابة للحوادث", "اختبار عملي 24 ساعة"] },
    cysa: { cat: 'defensive', level: 'متوسط', title: "CompTIA CySA+", price: "1,470 ر.س", mode: "نظري/عملي", desc: "تحليل البيانات الأمنية واكتشاف الثغرات.", org: "CompTIA", points: ["تركز على الدفاع النشط", "تحليل السجلات (Logs)"] },
    gcih: { cat: 'defensive', level: 'محترف', title: "GIAC GCIH", price: "3,500 ر.س", mode: "عملي", desc: "إدارة الحوادث المتقدمة واكتشاف الاختراقات.", org: "GIAC", points: ["شهادة احترافية عالمية", "تركز على التعامل مع الهجوم"] },

    // حوكمة (3)
    itca: { cat: 'grc', level: 'مبتدئ', title: "ISACA ITCA", price: "1,125 ر.س", mode: "نظري", desc: "تأسيس الحوكمة والتدقيق وإدارة المخاطر.", org: "ISACA", points: ["ممتازة لغير التقنيين", "بداية مسار التدقيق"] },
    cisa: { cat: 'grc', level: 'تأسيس', title: "CISA Auditor", price: "2,850 ر.س", mode: "نظري", desc: "المعيار العالمي لمدققي نظم المعلومات.", org: "ISACA", points: ["تعتمد على الفهم الإداري", "مطلوبة لشركات الاستشارات"] },
    cissp: { cat: 'grc', level: 'محترف', title: "CISSP", price: "2,808 ر.س", mode: "إداري", desc: "الشهادة القيادية الأعلى لإدارة الأمن السيبراني.", org: "(ISC)²", points: ["تتطلب خبرة 5 سنوات", "تغطي 8 مجالات أمنية"] }
};

function createCard(item, key) {
    const badgeClass = item.cat === 'offensive' ? 'badge-red' : (item.cat === 'defensive' ? 'badge-blue' : 'badge-green');
    return `<div class="course-card" onclick="showModal('${key}')">
        <span class="badge ${badgeClass}">${item.level}</span>
        <div class="course-title">${item.title}</div>
        <div class="course-desc">${item.desc}</div>
        <div class="meta-info"><span>${item.mode}</span><span>${item.price}</span></div>
    </div>`;
}

function renderAll() {
    const urlParams = new URLSearchParams(window.location.search);
    const userPath = urlParams.get('path'); 
    
    const recGrid = document.getElementById('recommendedGrid');
    const recSection = document.getElementById('recommendedSection');

    Object.keys(data).forEach(key => {
        const item = data[key];
        const cardHtml = createCard(item, key);

        // وضع الشهادات في القسم العلوي إذا كانت تطابق نتيجة الاختبار
        if (userPath && item.cat === userPath) {
            recSection.style.display = 'block';
            recGrid.innerHTML += cardHtml;
        }

        // وضع الشهادات في أقسامها الطبيعية بالأسفل
        document.getElementById(`grid-${item.cat}`).innerHTML += cardHtml;
    });
}

function showModal(key) {
    const item = data[key];
    document.getElementById('modalContent').innerHTML = `
        <h2 style="color:var(--accent); margin-top:0;">${item.title}</h2>
        <p>${item.desc}</p><hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:20px 0;">
        <p><strong>الجهة المنظمة:</strong> ${item.org}</p>
        <ul style="padding-right:20px;">${item.points.map(p => `<li style="margin-bottom:8px;">${p}</li>`).join('')}</ul>
    `;
    document.getElementById('infoModal').style.display = 'block';
}

function closeModal() { document.getElementById('infoModal').style.display = 'none'; }
window.onclick = e => { if (e.target == document.getElementById('infoModal')) closeModal(); }

renderAll();
</script>
</body>
</html>
