    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .social-contact-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 40px;
            text-align: right; /* For RTL context */
        }
        .social-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .social-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 255, 195, 0.1);
            border-color: var(--accent);
        }
        .social-card img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 8px; /* Softer edges for icons */
        }
        .social-card .social-text {
            color: var(--text);
            font-weight: bold;
            font-size: 16px;
        }
        @media (max-width: 768px) {
            .social-contact-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
