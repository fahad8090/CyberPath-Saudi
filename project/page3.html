<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Path | دليل الشهادات السيبرانية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .badge { padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: bold; margin-bottom: 10px; width: fit-content; }
        .badge-red { background: rgba(255, 77, 109, 0.15); color: #ff4d6d; }
        .badge-blue { background: rgba(77, 163, 255, 0.15); color: #4da3ff; }
        .badge-green { background: rgba(45, 212, 191, 0.15); color: #2dd4bf; }
        .badge-مبتدئ { background: rgba(22, 163, 74, 0.15); color: #16a34a; }
        .badge-متوسط { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .badge-محترف { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .main-content { flex: 1 0 auto; padding: 20px; position: relative; }
        .nav-top { max-width: 1200px; margin: 0 auto; display: flex; justify-content: flex-start; padding: 10px 0; }
        .home-link { color: var(--accent); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 8px; opacity: 0.8; transition: 0.3s; }
        .home-link:hover { opacity: 1; }
        .header { text-align: center; padding: 20px 0; }
        .header h1 { color: var(--accent); font-size: clamp(22px,4vw,32px); margin-bottom: 5px; }
        .controls-container { max-width: 600px; margin: 0 auto 30px; display: flex; gap: 10px; }
        .search-wrapper { flex: 1; position: relative; }
        .search-wrapper i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--accent); }
        .search-input { width: 100%; height: 45px; background: var(--card); border: 1px solid rgba(255,255,255,0.1); padding: 0 40px 0 15px; border-radius: 10px; color: #fff; outline: none; box-sizing: border-box; }
        .search-input:focus { border-color: var(--accent); }
        .filter-wrapper { position: relative; z-index: 1100; }
        .filter-btn { width: 45px; height: 45px; background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--accent); cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .filter-dropdown { display: none; position: absolute; top: calc(100% + 8px); right: 0; background: var(--card); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 10px; z-index: 1000; min-width: 160px; box-shadow: 0 16px 40px rgba(0,0,0,0.18); }
        .filter-dropdown.show { display: block; }
        .filter-option { display: flex; align-items: center; padding: 10px 12px; cursor: pointer; font-size: 14px; gap: 10px; color: var(--text); border-radius: 10px; }
        .filter-option:hover { background: rgba(255,255,255,0.05); }
        #recommendedSection { max-width: 1200px; margin: 0 auto 40px; padding: 25px; background: rgba(0, 255, 195, 0.05); border: 2px solid var(--accent); border-radius: 20px; display: none; }
        .recommendation-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; color: var(--accent); }
        .section-title { max-width: 1200px; margin: 40px auto 20px; border-bottom: 1px solid rgba(255,255,255,0.1); color: var(--muted); padding-bottom: 10px; font-size: 1.1rem; }
        .courses-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 100%; margin: 0 auto; padding: 0; }
        @media (min-width: 900px) { .courses-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .courses-grid { grid-template-columns: 1fr; } }
        .course-card { width: 100%; background: var(--card); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; }
        .course-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 8px 25px rgba(0, 255, 195, 0.15); }
        .card-img { width: 100%; height: 120px; background: linear-gradient(135deg, rgba(0,255,195,0.08), rgba(77,163,255,0.08)); display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--accent); position: relative; overflow: hidden; }
        .card-img::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--gradient); }
        .card-body { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .card-org { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-title { font-size: 15px; font-weight: 800; color: #fff; margin: 0; line-height: 1.3; }
        body.light .card-title { color: #111827; }
        .card-desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; flex-grow: 1; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); margin-top: auto; }
        .card-duration { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
        .card-btn { font-size: 11px; padding: 6px 14px; border-radius: 999px; background: var(--gradient); color: #000; text-decoration: none; font-weight: 700; border: none; cursor: pointer; transition: 0.3s; }
        .card-btn:hover { transform: scale(1.05); }
        .modal { display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); }
        .modal-content { background: var(--card); margin: 50px auto; padding: 30px 25px; border-radius: 20px; width: 90%; max-width: 550px; border: 1px solid var(--accent); position: relative; color: #fff; overflow-y: auto; max-height: 80vh; box-sizing: border-box; }
        .close-btn { position: absolute; left: 15px; top: 15px; font-size: 24px; cursor: pointer; color: var(--muted); transition: 0.3s; background: none; border: none; }
        .close-btn:hover { color: var(--red); }
        @media (max-width: 768px) { .filter-dropdown { right: 0; left: auto; width: min(2px, calc(100vw - 3px)); } }
    </style>
</head>
<body>

            <span></span>

            <button class="nav-theme-btn" aria-label="تبديل الوضع"><i class="fas fa-moon"></i></button>
        </div>

<main class="main-content">
<div class="cyber-bg"><div class="cyber-grid"></div></div>
    <div class="nav-top">
        <a href="../index.html" class="home-link"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
    </div>
    <div class="header">
        <h1>دليل الشهادات السيبرانية</h1>
        <p style="color:var(--muted);font-size:14px;">اكتشف الشهادات الأنسب لمسارك المهني</p>
    </div>
    <div class="controls-container">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن شهادة..." oninput="applyFilters()">
        </div>
        <div class="filter-wrapper">
            <button class="filter-btn" onclick="toggleFilter()"><i class="fas fa-filter"></i></button>
            <div class="filter-dropdown" id="filterDropdown">
                <label class="filter-option"><input type="checkbox" value="مبتدئ" onchange="applyFilters()"> مبتدئ</label>
                <label class="filter-option"><input type="checkbox" value="متوسط" onchange="applyFilters()"> متوسط</label>
                <label class="filter-option"><input type="checkbox" value="محترف" onchange="applyFilters()"> محترف</label>
            </div>
        </div>
    </div>
    <div id="recommendedSection">
        <div class="recommendation-header"><i class="fas fa-star"></i><h2>خطتك الدراسية المقترحة</h2></div>
        <div class="courses-grid" id="recommendedGrid"></div>
    </div>
    
    <!-- The certificate cards will be dynamically rendered here by main.js -->
</main>
<div id="infoModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeCertModal()">&times;</button>
        <div id="modalContent"></div>
    </div>
</div>
<button class="back-to-top" id="backToTop" onclick="scrollToTop()"><i class="fas fa-chevron-up"></i></button>
<script src="data.js"></script>
<script src="footer-injector.js"></script>
<script src="main.js"></script>
