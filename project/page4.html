<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انضم كمدرب معتمد | المستشار السيبراني السعودي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .container { max-width: 900px; margin: auto; padding: 40px 20px; flex: 1; }
        .section { padding: 35px; background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; text-align: right; }
        .gradient-text { background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; font-weight: 800; text-align: center; display: block; margin-bottom: 10px; }
        .instructor-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full-width { grid-column: span 2; }
        label { color: var(--accent); font-size: 14px; font-weight: bold; }
        input, select, textarea { 
            background: rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.1); 
            padding: 12px; 
            border-radius: 10px; 
            color: #fff; 
            font-family: inherit;
        }
        select option { background-color: #0f1623; color: #ffffff; }
        .submit-btn { 
            grid-column: span 2; 
            background: var(--gradient); 
            color: #000; 
            border: none; 
            padding: 15px; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 10px;
        }
        #success-alert {
            display: none;
            grid-column: span 2;
            background: rgba(0, 255, 195, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        #ai-chat-widget { position: fixed; bottom: 30px; left: 30px; z-index: 3000; }
        #ai-chat-btn { width: 60px; height: 60px; border-radius: 50%; background: var(--gradient); border: none; cursor: pointer; font-size: 24px; color: #000; box-shadow: 0 5px 20px rgba(0,255,195,0.4); }
    </style>
</head>
<body>

<div class="cyber-bg">
    <div class="cyber-grid"></div>
</div>

<nav class="nav-bar">
    <div class="nav-container">
        <button class="nav-toggle" aria-label="فتح القائمة">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a href="../index.html" class="nav-brand">المستشار السيبراني السعودي</a>
        <div style="display:flex; align-items:center; gap:8px;">
            <button class="nav-theme-btn" aria-label="تبديل الوضع">
                <i class="fas fa-moon"></i>
            </button>
            <a href="#" class="nav-login" aria-label="تسجيل الدخول">
                <i class="fas fa-user"></i>
            </a>
        </div>
    </div>
    <div class="nav-menu">
        <a href="../index.html" class="nav-link">الرئيسية</a>
        <a href="page2.html" class="nav-link">الاختبار التحليلي</a>
        <a href="page3.html" class="nav-link">دليل الشهادات</a>
        <a href="page4.html" class="nav-link">انضم كمدرب</a>
        <a href="about.html" class="nav-link">من نحن</a>
    <a href="page5.html" class="nav-link">تواصل معنا</a>
    </div>
</nav>

<div class="container">
    <div class="section" style="margin-top: 0;">
        <span class="gradient-text">انضم كمدرب معتمد</span>
        <p style="text-align: center; color: var(--muted);">
            شارك خبرتك في الأمن السيبراني وساهم في بناء جيل من المحترفين السعوديين
        </p>

        <form class="instructor-form" id="instructorForm" onsubmit="event.preventDefault(); document.getElementById('success-alert').style.display='block';">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" placeholder="أدخل اسمك الكامل" required>
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="example@domain.com" required>
            </div>
            <div class="form-group">
                <label>رقم الجوال</label>
                <input type="tel" placeholder="05xxxxxxxx">
            </div>
            <div class="form-group">
                <label>التخصص</label>
                <select>
                    <option>اختر تخصصك</option>
                    <option>العمليات الهجومية</option>
                    <option>العمليات الدفاعية</option>
                    <option>الحوكمة والامتثال</option>
                    <option>أمن الشبكات</option>
                    <option>أمن التطبيقات</option>
                </select>
            </div>
            <div class="form-group">
                <label>الشهادات المهنية</label>
                <input type="text" placeholder="مثال: OSCP, CISSP, CISA">
            </div>
            <div class="form-group">
                <label>سنوات الخبرة</label>
                <select>
                    <option>اختر</option>
                    <option>أقل من 3 سنوات</option>
                    <option>3 - 5 سنوات</option>
                    <option>5 - 10 سنوات</option>
                    <option>أكثر من 10 سنوات</option>
                </select>
            </div>
            <div class="form-group full-width">
                <label>نبذة عن خبراتك</label>
                <textarea rows="4" placeholder="اكتب ملخصاً عن مسيرتك المهنية والشهادات التي حصلت عليها..."></textarea>
            </div>
            <div class="form-group full-width" style="text-align: center;">
                <button type="submit" class="submit-btn">إرسال الطلب</button>
                <div id="success-alert">✅ تم استلام طلبك بنجاح! سنتواصل معك قريباً.</div>
            </div>
        </form>
    </div>
</div>

<div id="ai-chat-widget">
    <button id="ai-chat-btn"><i class="fas fa-robot"></i></button>
</div>

<button class="back-to-top" id="backToTop" onclick="scrollToTop()"><i class="fas fa-chevron-up"></i></button>

<footer>
    <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
        جميع الحقوق محفوظة &copy; 2026 - مستشارك السيبراني السعودي
    </div>
</footer>

<script src="main.js"></script>
</body>
</html>
